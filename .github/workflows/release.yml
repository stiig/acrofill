name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # A tag push matches neither trigger in ci.yml, so without these the
      # gem would publish with no test run at all — and a pushed version
      # cannot be replaced on RubyGems.
      - run: bundle exec rspec
      - run: bundle exec rubocop
      - uses: rubygems/release-gem@v1
